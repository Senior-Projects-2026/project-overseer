# --- Network ---
server.tcp.port=54555
server.udp.port=54777

# --- Server Loop & Sync ---
server.tick.sleep.ms=50
server.sync.interval=1.0

# --- World ---
world.seed=123

# --- Gameplay & Day/Night Cycle ---
gameplay.day.length.seconds=100.0
gameplay.night.threshold=0.7
gameplay.win.days=30
gameplay.punch.cooldown.ms=250
gameplay.hunger.sync.interval=5
gameplay.starvation.health.sync.interval=1
gameplay.regeneration.health.sync.interval=1

# --- AI Entities ---
ai.scan.interval=0.3

# --- Project Overseer (Python AI Director) ---
overseer.api.url=http://localhost:8000/evaluate
overseer.collection.interval=30.0
overseer.match.id=dev-match-1

# --- Chat system ---
chat.message.interval=500000000
